[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "mypy>=2.3.1",
    "types-psutil>=7.2.2.20260827",
    "boto3-stubs[s3]>=1.43.89",
    "ruff>=0.16.6",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres]>=4.15.0,<5.0.0",
    "pyyaml>=6.0.2,<7.0.0",
]

[project]
name = "dyvine"
# Single version line: ``plugin.yaml`` + both ``__version__`` values match
# this (pinned by tests/test_packaging.py). Bump all four together.
version = "1.0.0"
description = "Hermes plugin for Douyin download automation (users, posts, livestreams, queues, Feishu delivery)"
requires-python = ">=3.12"
authors = [
    { name = "Bill Duke", email = "billduke@memenow.xyz" }
]
dependencies = [
    # Core dependencies. Each direct dependency carries an upper bound so
    # ``pyproject.toml`` resolution does not silently drag the next major
    # version onto the plugin once it ships. ``uv.lock`` still pins exact
    # versions for reproducible installs in CI; the bounds below add a
    # second guard for installers that read pep-621 metadata without
    # consulting the lockfile (pip, hermes plugin installs).
    # NOTE: keep this list in sync with ``plugin.yaml``
    # ``python_dependencies`` (plus operator-side ``alembic`` below):
    # hermes installs entry-point plugins from these bounds.
    "pydantic>=2,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    # ``httpx`` floor MUST keep admitting f2 0.0.1.7's ``==0.27.2``
    # pin: loose installers (pip, hermes plugin installs) resolve f2's
    # pins, so raising this floor would make pip installs unresolvable.
    # ``[tool.uv] override-dependencies`` below lifts the development
    # lockfile to 0.28+. Both surfaces are safe: 0.27.2 -> 0.28.1 only
    # *removes* the deprecated ``app``/``proxies`` Client kwargs, which
    # neither dyvine nor f2 uses (verified by signature diff; pinned by
    # tests/test_packaging.py). Do not raise this floor until f2 loosens
    # its ``==`` metadata upstream.
    "httpx>=0.27.2,<1.0.0",
    # ``python-dotenv`` and ``boto3`` floors admit the Hermes Agent pins
    # (core ``python-dotenv==1.2.2``, bedrock extra ``boto3==1.42.89``).
    # Hermes resolves a directory plugin's ``[project].dependencies``
    # together with its own pins: ``hermes plugins enable`` refuses an
    # unresolvable union, and ``hermes update`` disables a plugin whose
    # union stops resolving. Never raise a floor past a Hermes pin
    # (test-pinned in ``tests/hermes/test_plugin.py``).
    "python-dotenv>=1.2.2,<2.0.0",

    # External integrations. ``f2`` is an especially low-maintenance
    # upstream and pins many of its own deps with ``==``, so we tightly
    # constrain it; widen the bound only after a deliberate test pass.
    "boto3>=1.42.89,<2.0.0",
    "f2>=0.0.1.7,<0.0.2",
    # Headless-Chromium signing session for the Argus webSign layer.
    # Pinned exactly: the wheel and the browser build are a validated
    # pair (1.62.0 against the production host's chromium-1234), and a
    # drift breaks launches with "Executable doesn't exist". The wheel
    # alone is not enough either: each host must also provide the
    # matching Chromium build (``playwright install chromium`` once;
    # production hosts keep it warm under the service user's cache).
    "playwright==1.62.0",

    # Utilities
    "prometheus-client>=0.26.0,<1.0.0",
    "psutil>=7.2.2,<8.0.0",

    # Persistence. Async SQLAlchemy over asyncpg is the only production
    # backend; Alembic versions the schema (see ``alembic/``).
    "sqlalchemy[asyncio]>=2.0.52,<3.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "alembic>=1.19.2,<2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# ``--import-mode=importlib`` imports test modules by path without
# inserting directories into ``sys.path``. The repo root must carry an
# ``__init__.py`` (hermes directory plugins require ``plugin.yaml`` +
# ``__init__.py`` with ``register()`` beside each other), and the
# default ``prepend`` mode would treat the root as package ``dyvine``
# and shadow ``src/dyvine`` on the import path. ``tests/conftest.py``
# already puts ``src/`` and ``tests/`` on ``sys.path`` explicitly, so
# no test relies on pytest's insertion. Test basenames must stay
# unique (no ``__init__.py`` packages under ``tests/``).
addopts = "-v --tb=short --asyncio-mode=auto --import-mode=importlib"
# Each fixture binds to the function-scoped event loop so async tests
# do not accidentally share state via a longer-lived loop.
asyncio_default_fixture_loop_scope = "function"
# Treat every warning as an error (replaces the previous ``-W error``
# CI flag), but allow the unavoidable upstream deprecations through.
# ``websockets_proxy 0.1.2`` (a transitive dependency of f2) still
# imports ``websockets.legacy.client``, which emits a DeprecationWarning
# under websockets >= 14. Drop the targeted ignores once
# ``websockets_proxy`` migrates to ``websockets.asyncio``.
filterwarnings = [
    "error",
    "ignore:websockets\\..*:DeprecationWarning",
    "ignore::DeprecationWarning:websockets.*",
    "ignore::DeprecationWarning:websockets_proxy.*",
    # anyio >= 4.15 deprecates the ``anyio.abc.BlockingPortal`` alias in
    # favour of ``anyio.from_thread.BlockingPortal``; some transitive
    # dependency still imports the old path at module scope. Drop this
    # once the import moves.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
    # pytest 9 promotes unraisable exceptions to warnings. The SSLSocket
    # ignores below silence exactly one proven source: f2's import-time
    # msToken fetch (``TokenManager.gen_real_msToken`` runs a real HTTPS
    # POST from a pydantic model class body at import and never closes
    # its one-shot sync client; see tests/test_import_time_network.py).
    # The dropped client is unreachable from dyvine, and GC timing makes
    # per-module narrowing unsound (first f2 import happens once per
    # session; the warning can surface in any later test), so the ignore
    # stays global. TODO: drop once f2 closes that client or defers the
    # fetch off the import path. CPython phrases the notice two ways
    # ("in ..." vs "while finalizing ..."); ignore both spellings.
    "ignore:Exception ignored in.*ssl\\.SSLSocket:pytest.PytestUnraisableExceptionWarning",
    "ignore:Exception ignored while finalizing.*ssl\\.SSLSocket:pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "asyncio: mark test as async/await test"
]

[project.entry-points."hermes_agent.plugins"]
# Host convention: hermes loads this module and then calls its
# ``register(PluginContext)`` (see src/dyvine_hermes/__init__.py), so the
# value is deliberately a bare module, not ``dyvine_hermes:register``.
dyvine = "dyvine_hermes"

[tool.hatch.build.targets.wheel]
packages = ["src/dyvine", "src/dyvine_hermes"]
# NOTE: plugin.yaml and alembic/ are intentionally directory-distribution
# only (verified: `uv build --wheel` ships just the two packages above).
# plugin.yaml is read from repo checkouts by directory installs (pip
# installs use entry_points.txt instead), and migrations run operator-side
# from a checkout (`uv run alembic upgrade head`), never in the gateway
# host — see plugin.yaml. Do not force-include either without revisiting
# that contract (pinned by tests/test_packaging.py).

[tool.uv]
# f2 0.0.1.7 (the upstream Douyin SDK) pins the packages below with ``==``
# in its packaging metadata, even though its source already targets the
# httpx 0.28+ surface (mounts=, httpx.Proxy(url=...)) and pydantic v2
# stable APIs (model_dump / model_validate). Without these overrides the
# uv resolver would otherwise drag every transitive dependency back to
# the December-2024 versions f2 was last released against. Drop a row
# from this list once f2 ships looser metadata upstream.
override-dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "websockets>=17.1",
    "cryptography>=50.0.1",
    "black>=26.5.1",
    "aiofiles>=25.1.0",
    "pyyaml>=6.0.3",
    "protobuf>=7.36.1",
]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.claude
  | \.serena
)/
'''

[tool.isort]
profile = "black"
line_length = 88
# The repo-local ./alembic/ migration package shadows the third-party
# distribution name; without this isort classifies `alembic` imports as
# first-party and disagrees with ruff's isort rules.
known_third_party = ["alembic"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "S",  # flake8-bandit
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are pytest's mechanism; /tmp paths, fake secrets, list-arg
# subprocess, and constant-table SQL are fixture idioms, not findings.
"tests/**" = ["S101", "S106", "S108", "S603", "S608"]
# Operator migration scripts: SQL interpolates module-constant table names
# only (no user input reaches the query). Remaining asserts are
# provably-held narrowing with per-line noqa + proof comments.
"scripts/**" = ["S608"]
# FP: "0.0.0.0" is a loopback-host *string* in a comparison set, not a bind.
"src/dyvine/core/settings.py" = ["S104"]
# FP: Feishu token *endpoint URL*, not a credential.
"src/dyvine/services/delivery.py" = ["S105"]
# FP: random.uniform is poll-interval jitter, not cryptography.
"src/dyvine/services/watch.py" = ["S311"]
# FP: all three except-pass sites are documented best-effort cleanup.
"src/dyvine/services/websign.py" = ["S110"]

[tool.ruff.lint.isort]
# Mirror the [tool.isort] override: ./alembic/ is a repo-local package
# that shadows the third-party distribution name.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
