name: Security Scan

on:
  # Weekly audit plus every PR/push to main: a vulnerable dependency
  # must fail before it merges, not six days later on Monday.
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Run every Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  dependency-check:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.10"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run dependency audit
      # pip-audit cannot read uv.lock ("no lockfiles found"), and
      # auditing an exported requirements file re-resolves through pip,
      # whose resolver disagrees with uv's on some pins. Instead audit
      # the synced environment in place: ``uv sync --frozen`` installs
      # exactly the locked versions, so ``--local`` audits the lock set
      # with no reinstall involved.
      run: uv run --with pip-audit pip-audit --local --strict --format=json --output pip-audit-report.json

    - name: Upload safety results
      uses: actions/upload-artifact@v7
      with:
        name: pip-audit-report
        path: pip-audit-report.json
