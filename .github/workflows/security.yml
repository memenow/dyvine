name: Security Scan

on:
  # Weekly audit plus every PR/push to main: a vulnerable dependency
  # must fail before it merges, not six days later on Monday.
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Run every Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-check:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.10"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run dependency audit
      # pip-audit cannot read uv.lock ("no lockfiles found"), and
      # auditing an exported requirements file re-resolves through pip,
      # whose resolver disagrees with uv's on some pins. Instead audit
      # the synced environment in place: ``uv sync --frozen`` installs
      # exactly the locked versions, so ``--local`` audits the lock set
      # with no reinstall involved.
      run: uv run --with "pip-audit==2.9.0" pip-audit --local --strict --format=json --output pip-audit-report.json

    - name: Upload safety results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: pip-audit-report
        path: pip-audit-report.json
