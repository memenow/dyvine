name: Security Scan

on:
  # Weekly audit plus every PR/push to main: a vulnerable dependency
  # must fail before it merges, not six days later on Monday.
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Run every Monday at 6 AM UTC
  workflow_dispatch:

permissions:
  security-events: write
  contents: read

jobs:
  dependency-check:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.10"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run dependency audit
      # pip-audit cannot read uv.lock ("no lockfiles found"), and
      # auditing an exported requirements file re-resolves through pip,
      # whose resolver disagrees with uv's on some pins. Instead audit
      # the synced environment in place: ``uv sync --frozen`` installs
      # exactly the locked versions, so ``--local`` audits the lock set
      # with no reinstall involved.
      run: uv run --with pip-audit pip-audit --local --strict --format=json --output pip-audit-report.json

    - name: Upload safety results
      uses: actions/upload-artifact@v7
      with:
        name: pip-audit-report
        path: pip-audit-report.json

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build Docker image for scanning
      run: |
        docker build -t scan-target:latest .

    - name: Scan image and enforce vulnerability budget
      # Mirrors the ``ci.yml`` container-scan gate: table output is the
      # pass/fail signal (SARIF ignore handling in trivy-action is
      # lossy, so a SARIF gate could re-include accepted findings).
      # Keep the SARIF pass below observability-only (``exit-code: 0``).
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: 'scan-target:latest'
        format: 'table'
        exit-code: '1'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        trivyignores: '.trivyignore'

    - name: Produce SARIF for Code Scanning
      if: always()
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: 'scan-target:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '0'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        trivyignores: '.trivyignore'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-container'
