name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  UV_CACHE_DIR: /tmp/.uv-cache

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        # ``requires-python`` allows 3.14, so the matrix covers it instead of
        # leaving the newest supported interpreter untested.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.10"
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --all-extras --frozen

    - name: Run tests
      # ``filterwarnings = error`` lives in pytest.ini so the same rule
      # applies to local runs and command-line ``-W`` overrides do not
      # short-circuit the targeted ignores documented there.
      run: uv run pytest --cov=src/dyvine --cov=src/dyvine_hermes --cov-report=xml --cov-fail-under=80

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        # ``file`` was removed in v5+; ``files`` adds to auto-discovered
        # reports, so ``disable_search`` keeps the upload to coverage.xml.
        files: coverage.xml
        disable_search: true
        fail_ci_if_error: false

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.10"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras --frozen

    - name: Check formatting with Black
      run: uv run black --check .

    - name: Check import sorting with isort
      run: uv run isort --check-only .

    - name: Lint with Ruff
      run: uv run ruff check .

    - name: Type check with MyPy
      run: uv run mypy src/dyvine src/dyvine_hermes __init__.py

  migrations:
    name: Migration drift check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dyvine
          POSTGRES_PASSWORD: dyvine
          POSTGRES_DB: dyvine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.10"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras --frozen

    - name: Upgrade to head, then check for drift
      # ``alembic check`` fails when ``models.py`` and the migration
      # scripts disagree, so the baseline docstring's drift claim holds.
      # API_DEBUG=true skips the production-placeholder validator; the
      # default DATABASE_URL already points at this service.
      env:
        API_DEBUG: "true"
      run: |
        uv run alembic upgrade head
        uv run alembic check

  doctor:
    name: Hermes plugin doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Validate with the real plugin runtime
      # No dependency install here: doctor copies the plugin tree, and a
      # local ``.venv`` would bloat that copy for no benefit. ``latest``
      # tracks the hermes release the catalog reviews against; the
      # manifest's ``requires_hermes`` floor is the compatibility claim.
      run: docker run --rm -v ${{ github.workspace }}:/plugin:ro nousresearch/hermes-agent:latest plugins doctor --ci /plugin
