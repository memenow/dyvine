name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # ``requires-python`` allows 3.14, so the matrix covers it instead of
        # leaving the newest supported interpreter untested.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.10"
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --all-extras --frozen

    - name: Run tests
      # ``filterwarnings = error`` lives in pytest.ini so the same rule
      # applies to local runs and command-line ``-W`` overrides do not
      # short-circuit the targeted ignores documented there.
      run: uv run pytest --cov=src/dyvine --cov-report=xml --cov-fail-under=80

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: coverage.xml
        fail_ci_if_error: false

  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.10"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras --frozen

    - name: Check formatting with Black
      run: uv run black --check .

    - name: Check import sorting with isort
      run: uv run isort --check-only .

    - name: Lint with Ruff
      run: uv run ruff check .

    - name: Type check with MyPy
      run: uv run mypy src/dyvine

  migrations:
    name: Migration drift check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dyvine
          POSTGRES_PASSWORD: dyvine
          POSTGRES_DB: dyvine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.10"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras --frozen

    - name: Upgrade to head, then check for drift
      # ``alembic check`` fails when ``models.py`` and the migration
      # scripts disagree, so the baseline docstring's drift claim holds.
      # API_DEBUG=true skips the production-secret validator; the
      # default DATABASE_URL already points at this service.
      env:
        API_DEBUG: "true"
      run: |
        uv run alembic upgrade head
        uv run alembic check

  manifests:
    name: Kustomize render check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Render production overlay
      # Placeholders (INGRESS_HOST, DB_CIDR) render as literal strings;
      # this gate catches YAML errors and drifting JSON6902 paths, not
      # placeholder values (a manual rollout substitutes those via the
      # sed pipeline documented in the overlay's kustomization.yaml).
      # ``kubectl`` ships on the runner image; no extra setup needed.
      run: kubectl kustomize k8s/overlays/production > /dev/null

    - name: Render migration job
      run: kubectl kustomize k8s/jobs/migrate > /dev/null

  container-scan:
    name: Container Vulnerability Scan
    # No ``needs`` gate: the scan builds the image itself and must run
    # even when lint/typecheck is red — a vulnerable base image matters
    # most exactly when other gates are already failing.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build Docker image for scanning
      run: |
        # Build the image locally (no push) so we can scan the exact
        # artifact produced by this PR/commit. We intentionally do not
        # authenticate to any registry here so PR-triggered runs from
        # forks cannot access production secrets.
        docker build -t scan-target:${{ github.sha }} .

    - name: Assert no dev tooling in runtime image
      run: |
        # The builder stage deletes the f2-injected ``black`` binary, its
        # dist-info, and the package directory explicitly. If that ``rm``
        # ever fails silently (glob mismatch, path relocation in a future
        # f2 / uv release, etc.), catch the regression here instead of
        # shipping the binary to production.
        docker run --rm --entrypoint /bin/sh scan-target:${{ github.sha }} \
          -c '! test -x /app/.venv/bin/black'

    - name: Scan image and enforce vulnerability budget
      # Table output is the pass/fail gate because ``aquasecurity/trivy-action``
      # v0.35.0 drops ``.trivyignore`` when the format is SARIF, which
      # would otherwise re-include already-accepted findings and break
      # the build. Keep the table format here (with ``exit-code: 1``)
      # and treat the subsequent SARIF pass as observability only.
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        image-ref: 'scan-target:${{ github.sha }}'
        format: 'table'
        exit-code: '1'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        trivyignores: '.trivyignore'

    - name: Produce SARIF for Code Scanning
      if: always()
      uses: aquasecurity/trivy-action@v0.35.0
      with:
        image-ref: 'scan-target:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '0'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        trivyignores: '.trivyignore'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-container'
