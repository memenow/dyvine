apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dyvine

resources:
  - migrate-job.yaml

# Pin ``newTag`` to the image being deployed before applying (no CD
# pipeline does it for you), e.g.::
#
#   kubectl kustomize k8s/jobs/migrate \
#     | sed 's|/dyvine:main-latest|/dyvine:<tag>|' \
#     | kubectl apply -f -
images:
  - name: ghcr.io/memenow/dyvine
    newTag: main-latest

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: latest
