# PodDisruptionBudget for the dyvine-api Pods.
#
# ``maxUnavailable: 1`` lets node drains and cluster-autoscaler
# scale-down proceed: at 2+ replicas one stays up throughout, while at
# the single-replica floor (HPA ``minReplicas: 1``) a drain means a
# brief API outage until the replacement Pod passes ``/readyz``. That
# trade-off is deliberate: the retired alternative (``minAvailable: 1``
# with ``minReplicas: 1``) blocks EVERY voluntary node drain at steady
# state and hangs node maintenance. The Deployment itself rolls with
# ``RollingUpdate`` (``maxUnavailable: 1, maxSurge: 1``) over
# ``emptyDir`` scratch, so no volume attach blocks rescheduling.
#
# IMPORTANT: a PDB protects against *voluntary* disruptions only.
# Involuntary disruptions — node failure, OOMKill, kernel panic,
# ``preemption`` of a spot instance — bypass this budget entirely.
#
# The singleton watcher intentionally has no PDB: it takes no traffic,
# and a disruption just delays polling until Kubernetes restarts it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dyvine-api-pdb
  namespace: dyvine
  labels:
    app.kubernetes.io/name: dyvine
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: dyvine
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dyvine
      app.kubernetes.io/component: api
