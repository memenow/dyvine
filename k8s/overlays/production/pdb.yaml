# PodDisruptionBudget for the dyvine-api Pods.
#
# ``maxUnavailable: 0`` blocks every voluntary disruption (node drain
# during cluster autoscale, ``kubectl drain``, drain-on-upgrade, etc.)
# until the operator reschedules the Pod manually. This is the only
# safe configuration today because the Deployment uses the ``Recreate``
# strategy backed by a ReadWriteOnce PVC: a rolling-update surge Pod
# would not be able to attach the volume, and an involuntary drain
# without a PDB would leave the API offline for the duration of the
# detach/attach cycle.
#
# IMPORTANT: a PDB protects against *voluntary* disruptions only.
# Involuntary disruptions — node failure, OOMKill, kernel panic,
# ``preemption`` of a spot instance — bypass this budget entirely.
# Operators should pair this PDB with monitoring on the underlying
# node and a runbook for manual cluster maintenance (drain the PDB
# selector, reschedule, restore the budget).
#
# The API Deployment rolls (RollingUpdate + HPA), so voluntary
# disruptions are safe as long as one replica stays up. The singleton
# watcher intentionally has no PDB: it takes no traffic, and a
# disruption just delays polling until Kubernetes restarts it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dyvine-api-pdb
  namespace: dyvine
  labels:
    app.kubernetes.io/name: dyvine
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: dyvine
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dyvine
      app.kubernetes.io/component: api
