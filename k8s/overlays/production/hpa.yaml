# Production scales the API horizontally: workspaces are pod-local
# scratch (R2 archival enforced by the multi-replica boot guard) and
# operation/watch state is multi-replica safe in Postgres. First phase
# caps at 3 replicas; raise after observing a scaling cycle.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dyvine-api-hpa
  namespace: dyvine
  labels:
    app.kubernetes.io/name: dyvine
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: dyvine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dyvine-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
